  tikv-2: {machine: "machine/ford10-google-storage-ge15min@us-east-1"}
  tikv-3: {machine: "machine/ford10-google-storage@us-east-2"}
  tikv-4: {machine: "machine/ford10-google-storage-ge15min@us-east-2"}
  tikv-5: {machine: "machine/ford10-google-storage@us-west-2"}
  tikv-6: {machine: "machine/ford10-google-storage-ge15min@us-west-2"}
