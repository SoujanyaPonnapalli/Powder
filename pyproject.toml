[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "powder"
version = "0.1.0"
description = "Markov modeling utilities for distributed systems analysis"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "plotly",
    "pyyaml",
    "scipy",
    "pandas",
]

[project.optional-dependencies]
cuda12 = [
    "cupy-cuda12x",
]
cudss = [
    "nvmath-python[cu12]",
]
mkl = [
    "pypardiso",
]
deploy = [
    "boto3>=1.34",
]
gurobi = [
    "gurobipy>=12,<14",
]
dev = [
    "pytest",
    "boto3>=1.34",
    "moto[ec2,ssm]>=5",
    "jupyterlab",
    "nbstripout",
    "pdfplumber>=0.11",
    "opencv-python-headless>=4.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["powder*"]
